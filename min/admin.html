<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - PROJECTFILE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 800px;">

    <!-- ============================================= -->
    <!-- LOGIN BOX (shown first, hidden after login)    -->
    <!-- ============================================= -->
    <div id="adminLoginBox">
      <h1 class="neon-title">🔐 Admin Login</h1>
      <form id="adminLoginForm">
        <div class="input-group">
          <input type="password" id="adminPass" placeholder="Enter admin password" required autocomplete="current-password">
        </div>
        <button type="submit" class="glow-btn pulse" style="width: 100%;">Login</button>
      </form>
      <div id="adminError" class="error"></div>
      <div style="text-align: center; margin-top: 20px;">
        <a href="index.html" class="neon-link">⬅ Back to Voter Login</a>
      </div>
    </div>

    <!-- ============================================= -->
    <!-- ADMIN PANEL (hidden until logged in)           -->
    <!-- ============================================= -->
    <div id="adminPanel" class="hidden">
      <h1 class="neon-title">🛠️ Admin Panel</h1>

      <!-- Tab buttons -->
      <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
        <button class="glow-btn" onclick="showTab('students')" style="flex:1;">Students</button>
        <button class="glow-btn" onclick="showTab('positions')" style="flex:1;">Positions</button>
        <button class="glow-btn" onclick="showTab('candidates')" style="flex:1;">Candidates</button>
      </div>

      <!-- ============================================ -->
      <!-- STUDENTS TAB                                  -->
      <!-- ============================================ -->
      <div id="studentsTab" class="tab-content hidden">
        <h3>Add Student</h3>
        <div class="input-group">
          <input type="text" id="studentIndex" placeholder="Index Number (e.g., UG1001)">
        </div>
        <div class="input-group">
          <input type="text" id="studentName" placeholder="Full Name">
        </div>
        <button class="glow-btn" onclick="addStudent()" style="width: 100%;">+ Add Student</button>

        <h3 style="margin-top: 30px;">Registered Students</h3>
        <table id="studentsTable" style="width: 100%; text-align: left; margin-top: 10px;">
          <thead>
            <tr>
              <th>Index</th>
              <th>Name</th>
              <th>Voted</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4" style="text-align:center; opacity:0.6;">Loading...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- ============================================ -->
      <!-- POSITIONS TAB                                 -->
      <!-- ============================================ -->
      <div id="positionsTab" class="tab-content hidden">
        <h3>Add Position</h3>
        <div class="input-group">
          <input type="text" id="positionTitle" placeholder="Position Title (e.g., President)">
        </div>
        <div class="input-group">
          <input type="number" id="positionOrder" placeholder="Display Order (0, 1, 2...)" value="0">
        </div>
        <button class="glow-btn" onclick="addPosition()" style="width: 100%;">+ Add Position</button>

        <h3 style="margin-top: 30px;">Existing Positions</h3>
        <ul id="positionsList" style="list-style: none; margin-top: 10px; padding: 0;">
          <li style="opacity: 0.6;">Loading...</li>
        </ul>
      </div>

      <!-- ============================================ -->
      <!-- CANDIDATES TAB                                -->
      <!-- ============================================ -->
      <div id="candidatesTab" class="tab-content hidden">
        <h3>Add Candidate</h3>
        <div class="input-group">
          <select id="candidatePosition">
            <option value="">-- Select a Position --</option>
          </select>
        </div>
        <div class="input-group">
          <input type="text" id="candidateName" placeholder="Candidate Name">
        </div>

        <!-- Hidden real file input, triggered by the glowing button below -->
        <input type="file" id="candidateImage" accept="image/*" style="display: none;">

        <button type="button" class="glow-btn" style="width: 100%;"
                onclick="document.getElementById('candidateImage').click()">
          📷 Choose Photo from Computer
        </button>
        <small id="fileNameDisplay"
               style="display: block; text-align: center; margin-top: -5px; margin-bottom: 15px; opacity: 0.7;">
          No file selected
        </small>

        <button class="glow-btn" onclick="addCandidate()" style="width: 100%;">+ Add Candidate</button>

        <h3 style="margin-top: 30px;">Candidates for Selected Position</h3>
        <div id="candidatesList" style="margin-top: 10px;">
          <p style="opacity: 0.6;">Loading...</p>
        </div>
      </div>

      <!-- ============================================ -->
      <!-- LOGOUT / NAVIGATION                           -->
      <!-- ============================================ -->
      <div style="margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;
                  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <button class="glow-btn" style="background: #ff416c;" onclick="logout()">🚪 Logout</button>
        <a href="index.html" class="neon-link" style="margin: 0;">⬅ Back to Voter Login</a>
      </div>
    </div>

  </div>

  <!-- Load the shared client logic first, then admin-specific init -->
  <script src="script.js"></script>
  <script>
    // On page load, if the admin already has a valid token, skip login
    // (optional convenience — if not, they'll just re-enter password)
    window.addEventListener('DOMContentLoaded', async () => {
      if (!sessionToken) return;
      // Try to fetch students as a validation probe
      const { ok } = await api('/api/admin/students');
      if (ok) {
        document.getElementById('adminLoginBox').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        showTab('students');
      } else {
        // Token invalid or expired → clear it and show login
        setToken(null);
      }
    });
  </script>
</body>
</html>
