<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="description" content="Secure university election voting system">
  <title>ElectroVote — Student Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- ============================================= -->
    <!-- HEADER                                         -->
    <!-- ============================================= -->
    <h1 class="neon-title">ElectroVote</h1>

    <p style="text-align: center; color: var(--text-secondary); margin-top: -20px; margin-bottom: 30px; font-size: 0.95rem;">
      Enter your credentials to cast your vote
    </p>

    <!-- ============================================= -->
    <!-- LOGIN FORM                                     -->
    <!-- ============================================= -->
    <form id="loginForm" autocomplete="on">

      <div class="input-group">
        <input
          type="text"
          id="indexNum"
          name="index_num"
          placeholder="Index Number (e.g., UG1001)"
          autocomplete="username"
          autocapitalize="characters"
          spellcheck="false"
          required>
      </div>

      <div class="input-group">
        <input
          type="text"
          id="fullName"
          name="full_name"
          placeholder="Full Name"
          autocomplete="name"
          autocapitalize="words"
          required>
      </div>

      <button type="submit" class="glow-btn accent pulse" style="width: 100%;">
        Sign In
      </button>

    </form>

    <!-- ============================================= -->
    <!-- ERROR MESSAGE                                  -->
    <!-- ============================================= -->
    <div id="errorMsg" class="error"></div>

    <!-- ============================================= -->
    <!-- FOOTER LINKS                                   -->
    <!-- ============================================= -->
    <div style="text-align: center; margin-top: 30px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.1);">
      <a href="results.html" class="neon-link">📊 View Live Results</a>
      <a href="admin.html" class="neon-link" style="font-size: 0.85rem; opacity: 0.75;">🔧 Admin Panel</a>
    </div>

    <!-- ============================================= -->
    <!-- SYSTEM STATUS (small, subtle)                  -->
    <!-- ============================================= -->
    <div style="text-align: center; margin-top: 24px; font-size: 0.75rem; color: var(--text-tertiary);">
      <span class="live-dot"></span>
      Connected to secure voting server
    </div>

  </div>

  <!-- Shared client-side helpers (api(), escapeHTML(), setToken(), login handler) -->
  <script src="script.js"></script>

  <!-- Small UX enhancement: focus first input on load -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const firstInput = document.getElementById('indexNum');
      if (firstInput) firstInput.focus();
    });
  </script>
</body>
</html>
